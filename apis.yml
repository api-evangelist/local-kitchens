name: Local Kitchens
description: Local Kitchens is a restaurant company that operates multi-brand "food
  hall" locations where a single kitchen prepares menu items from a curated set of
  local and national restaurant brands for on-demand pickup and delivery, ordered
  through its consumer website and mobile app. Surfaced as a portfolio company of
  General Catalyst and added to the API Evangelist network for enrichment, it is a
  consumer-facing hospitality and food-ordering business. As of this pass it does
  not publish a public developer API, developer portal, or API documentation — its
  web presence is a Cloudflare-fronted marketing and ordering site (Google Workspace
  email, Klaviyo, Twilio, Zoom in its DNS records).
